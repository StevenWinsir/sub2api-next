name: Frontend Next CI

# 仅在 frontend-next/ 或本工作流变化时运行（R5 切换后改名为 frontend/ 并并入 backend-ci）。
on:
  push:
    paths:
      - 'frontend-next/**'
      - 'docs/legal/**'
      - '.github/workflows/frontend-next-ci.yml'
  pull_request:
    paths:
      - 'frontend-next/**'
      - 'docs/legal/**'
      - '.github/workflows/frontend-next-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-next-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Unit tests · Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-next
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend-next/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint:check
      - name: Format check
        run: pnpm run format:check
      - name: Locale completeness (zh / en)
        run: pnpm run check:i18n
      - name: Typecheck
        run: pnpm run typecheck
      - name: Unit tests (ported contract specs + gate / registry / stores)
        run: pnpm run test:run
      - name: Build (static export) and verify artifact contract
        run: pnpm run build:verify
      - name: Upload exported site
        uses: actions/upload-artifact@v4
        with:
          name: frontend-next-out
          path: frontend-next/out
          retention-days: 7

  e2e:
    name: E2E (CSP + SPA fallback + injection contract)
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-next
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend-next/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download exported site
        uses: actions/download-artifact@v4
        with:
          name: frontend-next-out
          path: frontend-next/out
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run E2E against the contract server
        run: pnpm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend-next/playwright-report
            frontend-next/test-results
          retention-days: 7

  dockerfile-rehearsal:
    name: Original Dockerfile rehearsal (musl · lockfile · docs/legal)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Put frontend-next in the frontend/ position (temporary, CI only)
        run: |
          rm -rf frontend
          mkdir frontend
          tar -C frontend-next --exclude=node_modules --exclude=out --exclude=.next -cf - . | tar -C frontend -xf -
      - name: Build frontend stage with the ORIGINAL Dockerfile (alpine / musl)
        run: docker build --target frontend-builder -t sub2api-frontend-rehearsal -f Dockerfile .
      - name: Verify the artifact written for the Go embed
        run: |
          id=$(docker create sub2api-frontend-rehearsal)
          docker cp "$id:/app/backend/internal/web/dist" ./rehearsal-dist
          docker rm "$id"
          test -f rehearsal-dist/index.html
          grep -q '</head>' rehearsal-dist/index.html
          grep -q '<link rel="icon"' rehearsal-dist/index.html
          ! grep -E '<script>[^<]' rehearsal-dist/index.html
          ls rehearsal-dist | head -20
      - name: Build the full image with the ORIGINAL Dockerfile
        run: |
          docker build -f Dockerfile \
            --build-arg GOPROXY=https://proxy.golang.org,direct \
            --build-arg GOSUMDB=sum.golang.org \
            -t sub2api-next-rehearsal .
